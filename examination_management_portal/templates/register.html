{% extends "base.html" %}{% block content %}<div class="row justify-content-center"><div class="col-md-7"><div class="card p-4"><h2>{{role|title}} registration</h2>{% if role=='examiner' %}<div class="alert alert-info">Admin approval is required before examiner dashboard access.</div>{% endif %}<form method="post"><label class="form-label">Full name</label><input class="form-control mb-3" name="name" required><label class="form-label">Email</label><input class="form-control mb-3" type="email" name="email" required><label class="form-label">Password (8+ characters)</label><input class="form-control mb-3" type="password" name="password" minlength="8" required><label class="form-label">Department</label><input class="form-control mb-3" name="department"><label class="form-label">Contact</label><input class="form-control mb-3" name="contact"><button class="btn btn-primary">Register</button></form></div></div></div>{% endblock %}
