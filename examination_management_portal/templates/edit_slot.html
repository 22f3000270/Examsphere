{% extends "base.html" %}{% block content %}<div class="card p-4 col-lg-7"><h1>Edit slot</h1><form method="post"><label class="form-label">Date</label><input class="form-control mb-3" type="date" name="day" value="{{s.day}}" required><div class="row"><div class="col"><label class="form-label">Start</label><input class="form-control mb-3" type="time" name="start" value="{{s.start}}" required></div><div class="col"><label class="form-label">End</label><input class="form-control mb-3" type="time" name="end" value="{{s.end}}" required></div></div><label class="form-label">Capacity</label><input class="form-control mb-3" type="number" min="1" name="capacity" value="{{s.capacity}}" required><button class="btn btn-primary">Save slot</button></form></div>{% endblock %}
