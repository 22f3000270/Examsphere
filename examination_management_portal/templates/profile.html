{% extends "base.html" %}{% block content %}<div class="card p-4 col-lg-7"><h2>Edit profile</h2><form method="post"><label class="form-label">Name</label><input class="form-control mb-3" name="name" value="{{r.name}}" required><label class="form-label">Department</label><input class="form-control mb-3" name="department" value="{{r.department}}"><label class="form-label">Contact</label><input class="form-control mb-3" name="contact" value="{{r.contact}}"><label class="form-label">Email (not editable)</label><input class="form-control mb-3" value="{{r.email}}" disabled><button class="btn btn-primary">Save profile</button></form></div>{% endblock %}
