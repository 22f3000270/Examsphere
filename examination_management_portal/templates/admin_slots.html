{% extends "base.html" %}{% block content %}<h1>All examination slots</h1><form class="d-flex my-3"><input class="form-control me-2" name="q" value="{{q}}" placeholder="Search exam, examiner or slot ID"><button class="btn btn-primary">Search</button></form><div class="card"><div class="table-responsive"><table class="table mb-0"><tr><th>ID</th><th>Exam</th><th>Examiner</th><th>Date/time</th><th>Capacity</th><th>Status</th></tr>{% for s in rows %}<tr><td>{{s.id}}</td><td>{{s.exam}}</td><td>{{s.examiner}}</td><td>{{s.day}} {{s.start}}–{{s.end}}</td><td>{{s.booked}}/{{s.capacity}}</td><td>{{s.status}}</td></tr>{% endfor %}</table></div></div>{% endblock %}
