{% extends "base.html" %}{% block content %}<div class="card p-4 col-lg-7"><h1>Create examination slot</h1><form method="post"><label class="form-label">Assigned examination</label><select class="form-select mb-3" name="exam_id" required>{% for e in exams %}<option value="{{e.id}}">{{e.name}} (slot window {{e.slot_start}} – {{e.slot_end}})</option>{% endfor %}</select><label class="form-label">Date</label><input class="form-control mb-3" type="date" name="day" required><div class="row"><div class="col"><label class="form-label">Start</label><input class="form-control mb-3" type="time" name="start" required></div><div class="col"><label class="form-label">End</label><input class="form-control mb-3" type="time" name="end" required></div></div><label class="form-label">Maximum student capacity</label><input class="form-control mb-3" type="number" min="1" name="capacity" value="1" required><button class="btn btn-primary">Create slot</button></form></div>{% endblock %}
